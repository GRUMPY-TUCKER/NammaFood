spring.application.name=foodiesapi
server.port=8080
server.servlet.context-path=/foodies


# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nammafood
spring.datasource.username=nammafood
spring.datasource.password=nammafood
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



#AWS s3 configuration
spring.aws.access.key=replace_with_aws_access_key
spring.aws.secret.key=replace_with_aws_secret_key
spring.aws.region=ap-south-1
spring.aws.s3.bucketname=nammafood-prod-images

spring.jwt.secret.key=replace_with_secure_jwt_secret




#RazorPay Configuration

spring.razorpay_key=replace_with_razorpay_key
spring.razorpay_secret=replace_with_razorpay_secret


spring.profiles.active=development
spring.config.import=${SPRING_CONFIG_IMPORT:optional:file:./config/env.config.properties}
spring.cloud.config.enabled=false
